# T3 = T2 but the cost is Mahalanobis distance under the Kalman covariance instead
# of IoU. Still image space - this isolates the cost function from the coordinate frame.
_base: ../default.yaml
run_name: t3_image_maha_cmc_2stage
tracker: {space: image, cost: mahalanobis, use_cmc: true, use_color: false, two_stage: true}
kalman:
  # Pixel-space equivalents of the physical priors. The court spans ~18 m over
  # ~700 px here (~39 px/m), so 3 m/s^2 -> ~250 px/s^2 and 0.35 m -> ~14 px.
  # Having to do this conversion AT ALL - and having it be valid only for one
  # depth in the frame - is the argument the ground-plane rows are making.
  accel_std: 250.0
  meas_std: 20.0
