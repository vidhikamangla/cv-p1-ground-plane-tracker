# T7 = T2 moved onto the ground plane with the cost held FIXED at IoU.
# T4 changed two things at once (space AND cost); this row isolates the space.
_base: ../default.yaml
run_name: t7_ground_iou_cmc_2stage
tracker: {space: ground, cost: iou, use_cmc: true, use_color: false, two_stage: true}
kalman:
  # Swept on v_0kUtTtmLaJA_c004 exactly as the image rows were, and the best taken.
  # accel_std has to be pushed to 40 m/s^2 - physically absurd for a human - before the
  # ground-space filter is competitive. That is a finding, not a tuning detail: it says
  # the foot-point measurement carries large errors that are NOT on the plane (a jumping
  # player's box bottom is metres away from their feet), so the filter can only cope by
  # becoming almost purely measurement-trusting.
  accel_std: 40.0
  meas_std: 0.35
